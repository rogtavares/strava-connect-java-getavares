version: '3.8'

services:
  # Python FastAPI Backend
  api:
    build:
      context: ./api-RT
      dockerfile: Dockerfile
    container_name: strava-api
    ports:
      - "8000:8000"
    env_file:
      - ./api-RT/.env
    volumes:
      - ./api-RT:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - strava-network

  # Python Streamlit Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: strava-dashboard
    ports:
      - "8501:8501"
    env_file:
      - ./dashboard/.env
    environment:
      API_URL: http://api:8000
    volumes:
      - ./dashboard:/app
    depends_on:
      - api
    networks:
      - strava-network

networks:
  strava-network:
    driver: bridge
